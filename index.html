<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://acsokyrhfequnuvtmomx.supabase.co";
const SUPABASE_KEY = "sb_publishable_q5tlkRgV8Yv377vmWr8sHw_ZGKfWMPi";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let user = null;
let view = new Date();
view.setDate(1);

const pad = n => String(n).padStart(2, "0");

const key = (d, taskId) =>
  `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}|${taskId}`;

const monthKey = (y, m, d) =>
  `${y}-${pad(m + 1)}-${pad(d)}`;

let state = {
  tasks: [],
  marks: {}
};

const monthInput = document.querySelector("#month");

async function getUser() {
  const { data } = await db.auth.getUser();

  if (data.user) {
    user = data.user;
    return user;
  }

  const { data: anon, error } =
    await db.auth.signInAnonymously();

  if (error) {
    alert("Login error: " + error.message);
    return null;
  }

  user = anon.user;
  return user;
}

async function loadData() {
  user = await getUser();

  if (!user) return;

  const { data: tasks, error: taskError } =
    await db
      .from("tasks")
      .select("*")
      .eq("user_id", user.id)
      .order("id");

  if (taskError) {
    alert("Tasks load error: " + taskError.message);
    return;
  }

  const { data: marks, error: markError } =
    await db
      .from("marks")
      .select("*")
      .eq("user_id", user.id);

  if (markError) {
    alert("Marks load error: " + markError.message);
    return;
  }

  state.tasks = tasks || [];
  state.marks = {};

  (marks || []).forEach(m => {
    state.marks[
      `${m.mark_date}|${m.task_id}`
    ] = m.completed ? 1 : 2;
  });

  render();
}

function render() {
  const y = view.getFullYear();
  const m = view.getMonth();
  const days = new Date(y, m + 1, 0).getDate();

  monthInput.value = `${y}-${pad(m + 1)}`;

  document.querySelector("#monthTitle").textContent =
    view.toLocaleDateString("en-IN", {
      month: "long",
      year: "numeric"
    });

  let h = "<table><thead><tr><th>Task</th>";

  for (let d = 1; d <= days; d++) {
    h += `<th class="day">${d}</th>`;
  }

  h += "</tr></thead><tbody>";

  if (!state.tasks.length) {
    h += `
      <tr>
        <td colspan="${days + 1}" class="empty">
          Abhi koi task nahi. Upar se task add karo 👆
        </td>
      </tr>
    `;
  }

  state.tasks.forEach(t => {
    h += `
      <tr>
        <td>
          <div class="task-name">${esc(t.name)}</div>
          <div class="task-time">${esc(t.task_time || "")}</div>
          <button class="del" data-del="${t.id}">×</button>
        </td>
    `;

    for (let d = 1; d <= days; d++) {
      const date = monthKey(y, m, d);
      const k = `${date}|${t.id}`;

      const v = state.marks[k] || 0;

      const cls =
        v === 1 ? "yes" :
        v === 2 ? "no" :
        "none";

      const txt =
        v === 1 ? "✓" :
        v === 2 ? "✕" :
        "–";

      const today =
        key(new Date(), t.id) === k ? " today" : "";

      h += `
        <td>
          <button
            class="cell ${cls}${today}"
            data-k="${k}"
            aria-label="${txt}"
          >${txt}</button>
        </td>
      `;
    }

    h += "</tr>";
  });

  h += "</tbody></table>";

  document.querySelector("#grid").innerHTML = h;

  document.querySelectorAll("[data-k]").forEach(b => {
    b.onclick = () => toggleMark(b.dataset.k);
  });

  document.querySelectorAll("[data-del]").forEach(b => {
    b.onclick = () => deleteTask(b.dataset.del);
  });

  stats(y, m, days);
}

async function toggleMark(k) {
  if (!user) return;

  const parts = k.split("|");
  const date = parts[0];
  const taskId = parts[1];

  const old = state.marks[k] || 0;

  let next;

  if (old === 0) next = 1;
  else if (old === 1) next = 2;
  else next = 0;

  if (next === 0) {
    const { error } = await db
      .from("marks")
      .delete()
      .eq("user_id", user.id)
      .eq("task_id", taskId)
      .eq("mark_date", date);

    if (error) {
      alert("Mark save error: " + error.message);
      return;
    }

    delete state.marks[k];
  } else {
    await db
      .from("marks")
      .delete()
      .eq("user_id", user.id)
      .eq("task_id", taskId)
      .eq("mark_date", date);

    const { error } = await db
      .from("marks")
      .insert({
        user_id: user.id,
        task_id: taskId,
        mark_date: date,
        completed: next === 1
      });

    if (error) {
      alert("Mark save error: " + error.message);
      return;
    }

    state.marks[k] = next;
  }

  render();
}

async function deleteTask(id) {
  if (!user) return;

  if (!confirm("Task delete karna hai?")) return;

  const { error } = await db
    .from("tasks")
    .delete()
    .eq("id", id)
    .eq("user_id", user.id);

  if (error) {
    alert("Delete error: " + error.message);
    return;
  }

  await db
    .from("marks")
    .delete()
    .eq("task_id", id)
    .eq("user_id", user.id);

  await loadData();
}

function stats(y, m, days) {
  let yes = 0;
  let no = 0;

  state.tasks.forEach(t => {
    for (let d = 1; d <= days; d++) {
      const date = monthKey(y, m, d);
      const v = state.marks[`${date}|${t.id}`] || 0;

      if (v === 1) yes++;
      if (v === 2) no++;
    }
  });

  const total = yes + no;

  document.querySelector("#rate").textContent =
    total ? Math.round(yes / total * 100) + "%" : "0%";

  document.querySelector("#done").textContent = yes;
  document.querySelector("#miss").textContent = no;

  let best = 0;
  let cur = 0;

  const all = [];

  state.tasks.forEach(t => {
    for (let d = 1; d <= days; d++) {
      const date = monthKey(y, m, d);
      all.push(state.marks[`${date}|${t.id}`] || 0);
    }
  });

  all.forEach(v => {
    if (v === 1) {
      cur++;
      best = Math.max(best, cur);
    } else {
      cur = 0;
    }
  });

  document.querySelector("#streak").textContent = best;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

document.querySelector("#add").onsubmit = async e => {
  e.preventDefault();

  if (!user) return;

  const name =
    document.querySelector("#task").value.trim();

  const time =
    document.querySelector("#time").value.trim();

  if (!name) return;

  const { error } = await db
    .from("tasks")
    .insert({
      user_id: user.id,
      name: name,
      task_time: time
    });

  if (error) {
    alert("Task add error: " + error.message);
    return;
  }

  e.target.reset();

  await loadData();
};

document.querySelector("#prev").onclick = () => {
  view.setMonth(view.getMonth() - 1);
  render();
};

document.querySelector("#next").onclick = () => {
  view.setMonth(view.getMonth() + 1);
  render();
};

monthInput.onchange = () => {
  const [y, m] = monthInput.value.split("-").map(Number);

  view = new Date(y, m - 1, 1);

  render();
};

loadData();
</script>
