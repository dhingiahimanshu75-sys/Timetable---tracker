<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Timetable Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#080d1a;
  --card:#111a2d;
  --card2:#18233b;
  --text:#f4f7ff;
  --muted:#8d9ab5;
  --line:#263552;
  --accent:#6366f1;
  --accent2:#818cf8;
  --good:#22c55e;
  --bad:#ef4444;
  --pending:#64748b;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--text);
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 0%,#202b61 0%,transparent 35%),
    radial-gradient(circle at 90% 100%,#172554 0%,transparent 35%),
    var(--bg);
}

button,input{font:inherit}

button{
  cursor:pointer;
  color:var(--text);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:11px;
  padding:10px 14px;
  transition:.2s;
}

button:hover{
  border-color:var(--accent2);
  background:var(--card2);
}

input{
  width:100%;
  color:var(--text);
  background:#0d1527;
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px 14px;
  outline:none;
}

input::placeholder{color:#64748b}

input:focus{
  border-color:var(--accent2);
  box-shadow:0 0 0 3px rgba(99,102,241,.14);
}

.wrap{
  width:min(1200px,94%);
  margin:auto;
  padding:30px 0 50px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:25px;
}

h1{
  margin:0;
  font-size:30px;
  font-weight:800;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
}

.controls{
  display:flex;
  gap:9px;
  align-items:center;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:18px;
}

.stat{
  padding:20px;
  border:1px solid var(--line);
  border-radius:16px;
  background:linear-gradient(145deg,var(--card),#0d1527);
  box-shadow:0 12px 30px rgba(0,0,0,.2);
}

.stat b{
  display:block;
  font-size:28px;
  margin-bottom:4px;
}

.stat span{
  color:var(--muted);
  font-size:13px;
}

.panel{
  padding:20px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(17,26,45,.9);
  box-shadow:0 18px 45px rgba(0,0,0,.22);
}

.bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.bar strong{font-size:18px}

#add{
  display:flex;
  gap:9px;
  align-items:center;
}

#add input{width:190px}

#add button{
  background:linear-gradient(135deg,var(--accent),#4f46e5);
  border:0;
  font-weight:700;
}

.table-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:14px;
}

table{
  width:100%;
  min-width:1000px;
  border-collapse:separate;
  border-spacing:0;
}

th{
  padding:12px 8px;
  background:#0e1729;
  color:#aeb9d0;
  font-size:12px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}

td{
  height:50px;
  text-align:center;
  background:#10192c;
  border-right:1px solid #1d2942;
  border-bottom:1px solid #1d2942;
}

td:last-child,th:last-child{border-right:0}

.task-name{
  min-width:150px;
  text-align:left;
  padding-left:14px;
  font-weight:700;
}

.task-time{
  min-width:100px;
  color:var(--muted);
  font-size:12px;
}

.cell{
  width:42px;
  height:42px;
  padding:0;
  border:1px solid transparent;
  border-radius:10px;
  background:transparent;
  color:var(--pending);
  font-weight:800;
  font-size:17px;
}

.cell:hover{
  background:#1d293e;
  border-color:#334155;
}

.cell.complete{
  color:#4ade80;
  background:rgba(34,197,94,.1);
  border-color:rgba(34,197,94,.25);
}

.cell.missed{
  color:#f87171;
  background:rgba(239,68,68,.1);
  border-color:rgba(239,68,68,.25);
}

.cell.today{
  box-shadow:inset 0 0 0 2px var(--accent);
}

.del{
  color:#f87171;
  background:transparent;
  border:0;
  font-size:12px;
}

.empty{
  color:var(--muted);
  padding:35px 15px;
  text-align:center;
}

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:min(420px,100%);
  padding:30px;
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(17,26,45,.95);
  box-shadow:0 25px 70px rgba(0,0,0,.4);
}

.login-card h1{
  font-size:27px;
  margin-bottom:8px;
}

.login-card p{
  color:var(--muted);
  font-size:14px;
  margin:0 0 22px;
}

.login-card input{
  margin-bottom:11px;
}

.login-card button{
  width:100%;
  background:linear-gradient(135deg,var(--accent),#4f46e5);
  border:0;
  font-weight:700;
}

.switch{
  margin-top:15px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  cursor:pointer;
}

.switch:hover{color:var(--accent2)}

.user-area{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:13px;
}

#logout{
  padding:8px 12px;
}

.hidden{display:none!important}

@media(max-width:800px){
  .top{
    flex-direction:column;
    align-items:flex-start;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .bar{
    flex-direction:column;
    align-items:stretch;
  }

  #add{
    flex-wrap:wrap;
  }

  #add input{
    flex:1;
    min-width:130px;
  }
}

@media(max-width:480px){
  .wrap{padding-top:20px}

  h1{font-size:24px}

  .stats{
    gap:9px;
  }

  .stat{
    padding:14px;
  }

  .stat b{font-size:22px}

  .panel{padding:12px}

  .user-area{
    flex-direction:column;
    align-items:flex-start;
  }
}.cell.locked{
  opacity:.45;
  cursor:not-allowed;
}

.cell.verify{
  color:#facc15;
  background:rgba(250,204,21,.10);
  border-color:rgba(250,204,21,.25);
}

.cell.auto-missed{
  color:#f87171;
  background:rgba(239,68,68,.10);
  border-color:rgba(239,68,68,.25);
}
</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">

    <h1>📅 My Timetable Tracker</h1>
    <p id="loginText">Login karke apna tracker open karo.</p>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="authBtn">Login</button>

    <div id="switchAuth" class="switch">
      Account nahi hai? Signup
    </div>

  </div>
</div>

<div id="app" class="hidden">

<div class="wrap">

  <div class="top">

    <div>
      <h1>📅 My Timetable Tracker</h1>
      <div class="sub">
        ✓ = complete &nbsp; X = missed &nbsp; — = not marked
      </div>
    </div>

    <div class="user-area">
      <span id="userEmail"></span>
      <button id="logout">Logout</button>
    </div>

  </div>

  <div class="controls" style="justify-content:center;margin-bottom:18px">
    <button id="prev">‹</button>
    <input id="month" type="month">
    <button id="next">›</button>
  </div>

  <div class="stats">

    <div class="stat">
      <b id="rate">0%</b>
      <span>Monthly completion</span>
    </div>

    <div class="stat">
      <b id="done">0</b>
      <span>Completed</span>
    </div>

    <div class="stat">
      <b id="miss">0</b>
      <span>Missed</span>
    </div>

    <div class="stat">
      <b id="streak">0</b>
      <span>Best streak</span>
    </div>

  </div>

  <div class="panel">

    <div class="bar">

      <strong id="monthTitle">August 2026</strong>

      <form id="add">

        <input
          id="task"
          placeholder="Task / subject"
          required
        >

        <input
          id="time"
          placeholder="Time (e.g. 7:00 AM)"
          required
        >

        <button type="submit">+ Add task</button>

      </form>

    </div>

    <div id="grid" class="table-wrap"></div>

  </div>

</div>
</div>

<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL = "https://acsokyrhfequnuvtmomx.supabase.co";
const SUPABASE_KEY = "sb_publishable_q5tlkRgV8Yv377vmWr8sHw_ZGKfWMPi";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   APP STATE
   ========================================================= */

let user = null;
let tasks = [];
let marks = {};

let view = new Date();
view.setDate(1);

const pad = n => String(n).padStart(2,"0");

const dateKey = d =>
  `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;


/* =========================================================
   ELEMENTS
   ========================================================= */

const loginScreen = document.querySelector("#loginScreen");
const app = document.querySelector("#app");

const emailInput = document.querySelector("#email");
const passwordInput = document.querySelector("#password");

const authBtn = document.querySelector("#authBtn");
const switchAuth = document.querySelector("#switchAuth");
const loginText = document.querySelector("#loginText");

const userEmail = document.querySelector("#userEmail");
const logoutBtn = document.querySelector("#logout");

const monthInput = document.querySelector("#month");
const monthTitle = document.querySelector("#monthTitle");

const taskInput = document.querySelector("#task");
const timeInput = document.querySelector("#time");

const grid = document.querySelector("#grid");

let signupMode = false;


/* =========================================================
   LOGIN / SIGNUP
   ========================================================= */

switchAuth.onclick = () => {

  signupMode = !signupMode;

  if(signupMode){

    loginText.textContent =
      "Naya account create karo.";

    authBtn.textContent = "Signup";

    switchAuth.textContent =
      "Already account hai? Login";

  }else{

    loginText.textContent =
      "Login karke apna tracker open karo.";

    authBtn.textContent = "Login";

    switchAuth.textContent =
      "Account nahi hai? Signup";
  }

};


authBtn.onclick = async () => {

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if(!email || !password){
    alert("Email aur password dono bharo.");
    return;
  }

  authBtn.disabled = true;

  try{

    if(signupMode){

      const {data,error} =
        await db.auth.signUp({
          email,
          password
        });

      if(error) throw error;

      if(data.session){

        await startApp(data.session.user);

      }else{

        alert(
          "Signup successful. Agar email confirmation enabled hai to email verify karke login karo."
        );

        signupMode = false;
        switchAuth.click();
      }

    }else{

      const {data,error} =
        await db.auth.signInWithPassword({
          email,
          password
        });

      if(error) throw error;

      await startApp(data.user);
    }

  }catch(err){

    alert(err.message);

  }finally{

    authBtn.disabled = false;
  }

};


/* =========================================================
   LOGOUT
   ========================================================= */

logoutBtn.onclick = async () => {

  await db.auth.signOut();

  user = null;
  tasks = [];
  marks = {};

  app.classList.add("hidden");
  loginScreen.classList.remove("hidden");

};


/* =========================================================
   START APP
   ========================================================= */
async function ensureProfile(currentUser){

  if(!currentUser) return;

  const { data: existing, error: findError } =
    await db
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();

  if(findError) throw findError;

  if(!existing){

    const username =
      currentUser.email
        ? currentUser.email.split("@")[0]
        : "User";

    const { error: insertError } =
      await db
        .from("profiles")
        .insert({
          id: currentUser.id,
          username: username,
          rank: "A",
          lives: 3
        });

    if(insertError) throw insertError;
  }
}
async function startApp(currentUser){

  user = currentUser;

  userEmail.textContent =
    user.email || "";

  loginScreen.classList.add("hidden");
  app.classList.remove("hidden");

  await loadData();

  render();
}


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadData(){

  if(!user) return;

  try{

    const {data:taskData,error:taskError}
      = await db
        .from("tasks")
        .select("*")
        .eq("user_id",user.id)
        .order("created_at",{ascending:true});

    if(taskError) throw taskError;

    tasks = taskData || [];


    const {data:markData,error:markError}
      = await db
        .from("marks")
        .select("*")
        .eq("user_id",user.id);

    if(markError) throw markError;

    marks = {};

    (markData || []).forEach(m => {

      const taskId = m.task_id;

      const date =
        m.mark_date;

      let value = null;

      if(m.completed === true){
        value = 1;
      }else if(m.completed === false){
        value = 2;
      }

      marks[`${taskId}|${date}`] = value;

    });

  }catch(err){

    console.error(err);

    alert(
      "Data load nahi hua: " + err.message
    );
  }

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

  const y = view.getFullYear();
  const m = view.getMonth();

  const days =
    new Date(y,m+1,0).getDate();

  monthInput.value =
    `${y}-${pad(m+1)}`;

  monthTitle.textContent =
    view.toLocaleDateString("en-IN",{
      month:"long",
      year:"numeric"
    });


  let h = `
    <table>
      <thead>
        <tr>
          <th>Task</th>
          <th>Time</th>
  `;

  for(let d=1;d<=days;d++){

    h += `<th>${d}</th>`;
  }

  h += `
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
  `;


  if(tasks.length === 0){

    h += `
      <tr>
        <td colspan="${days+3}" class="empty">
          Abhi koi task nahi hai.<br>
          Upar se task add karo 👆
        </td>
      </tr>
    `;

  }else{

    tasks.forEach(t => {

      h += `
        <tr>

          <td class="task-name">
            ${esc(t.name)}
          </td>

          <td class="task-time">
            ${esc(t.time)}
          </td>
      `;


      for(let d=1;d<=days;d++){

        const k =
          `${t.id}|${y}-${pad(m+1)}-${pad(d)}`;

        const value =
          marks[k] || 0;

        const date =
          new Date(y,m,d);

        const today =
          dateKey(new Date()) === dateKey(date);

        let text = "—";
        let cls = "cell";

        if(value === 1){

          text = "✓";
          cls += " complete";

        }else if(value === 2){

          text = "X";
          cls += " missed";
        }

        if(today){
          cls += " today";
        }

        h += `
          <td>
            <button
              class="${cls}"
              data-k="${k}"
              aria-label="${text}"
            >${text}</button>
          </td>
        `;
      }


      h += `
          <td>
            <button
              class="del"
              data-del="${t.id}"
            >Delete</button>
          </td>

        </tr>
      `;
    });

  }

  h += `
      </tbody>
    </table>
  `;

  grid.innerHTML = h;


  /* MARK BUTTONS */

  document.querySelectorAll("[data-k]")
    .forEach(btn => {

      btn.onclick = async () => {

        const k = btn.dataset.k;

        const current =
          marks[k] || 0;

        /*
          0 = not marked
          1 = complete
          2 = missed
        */

        const next =
          current === 0 ? 1 :
          current === 1 ? 2 :
          0;

        marks[k] = next;

        render();

        await saveMark(k,next);
      };

    });


  /* DELETE BUTTONS */

  document.querySelectorAll("[data-del]")
    .forEach(btn => {

      btn.onclick = async () => {

        const id =
          btn.dataset.del;

        if(!confirm("Task delete karna hai?"))
          return;

        await deleteTask(id);
      };

    });


  updateStats(y,m,days);

}


/* =========================================================
   SAVE MARK
   ========================================================= */
/* =========================================================
   AI ACTIVITY VERIFICATION
   ========================================================= */

const VERIFICATION_MINUTES = 30;

let aiObjectModel = null;
let aiPoseModel = null;

let verificationRunning = false;
let verificationTimer = null;
let verificationStream = null;
let verificationKey = null;

let verificationProgress = 0;
let lastPose = null;


/* ---------- TASK TYPE ---------- */

function getTaskType(task){

  const text =
    `${task.name || ""} ${task.title || ""}`
      .toLowerCase()
      .trim();

  if(
    /running|run|jogging|jog| दौड़|दौड़/.test(text)
  ){
    return "running";
  }

  if(
    /study|studying|padhai|पढ़ाई|पढाई|book|reading|read/.test(text)
  ){
    return "study";
  }

  if(
    /water|paani|pani|drink|drinking|hydration|पानी/.test(text)
  ){
    return "water";
  }

  if(
    /exercise|workout|gym|push.?up|squat|yoga/.test(text)
  ){
    return "exercise";
  }

  return "general";
}


/* ---------- STATUS ---------- */

function getVerificationStatus(task,date){

  const mark =
    marks[`${task.id}|${date}`];

  if(mark === 1)
    return "done";

  const taskMinutes =
    parseTaskTime(task.time);

  if(taskMinutes === null)
    return "before";

  const target =
    new Date(`${date}T00:00:00`);

  target.setHours(
    Math.floor(taskMinutes / 60),
    taskMinutes % 60,
    0,
    0
  );

  const start =
    target.getTime();

  const end =
    start +
    VERIFICATION_MINUTES *
    60 *
    1000;

  const now =
    Date.now();

  if(
    target.toDateString() !==
    new Date().toDateString()
  ){

    if(target > new Date())
      return "future";

    return "expired";
  }

  if(now < start)
    return "before";

  if(now <= end)
    return "window";

  return "expired";
}


/* ---------- AI LOAD ---------- */

async function loadAIModels(){

  if(!aiObjectModel){

    aiObjectModel =
      await cocoSsd.load();

  }

  if(!aiPoseModel){

    aiPoseModel =
      await poseDetection.createDetector(

        {
          modelType:
            poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING
        }

/* ---------- VERIFICATION UI ---------- */

function createVerificationUI(task){

  const old =
    document.getElementById(
      "aiVerificationBox"
    );

  if(old)
    old.remove();

  const type =
    getTaskType(task);

  let instruction =
    "Camera ke saamne activity karo.";

  if(type === "running")
    instruction =
      "🏃 Running karo. Body movement verify hogi.";

  if(type === "study")
    instruction =
      "📚 Book/notebook ke saath study karo.";

  if(type === "water")
    instruction =
      "💧 Bottle ya glass ke saath paani piyo.";

  if(type === "exercise")
    instruction =
      "💪 Exercise movement karo.";

  const box =
    document.createElement("div");

  box.id =
    "aiVerificationBox";

  box.innerHTML = `

    <div style="
      position:fixed;
      inset:0;
      z-index:999999;
      background:rgba(0,0,0,.82);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    ">

      <div style="
        width:min(600px,96vw);

        color:white;
        border:1px solid #34415d;
        border-radius:20px;
        padding:22px;
        box-shadow:0 25px 80px rgba(0,0,0,.6);
        text-align:center;
      ">

        <h2 style="
          margin:0 0 8px;
          color:white;
        ">
          🤖 Activity Verification
        </h2>

        <p id="aiInstruction"
           style="
             color:#dbe4ff;
             font-size:16px;
             margin:8px 0 16px;
           ">
          ${instruction}
        </p>

        <video
          id="aiVerificationVideo"
          autoplay
          muted
          playsinline
          style="
            width:100%;
            max-height:360px;
            object-fit:cover;
            border-radius:14px;
            background:#050914;
            border:1px solid #394660;
          ">
        </video>

        <div style="
          margin-top:16px;
          height:14px;
          background:#273248;
          border-radius:20px;
          overflow:hidden;
        ">

          <div
            id="aiProgress"
            style="
              width:0%;
              height:100%;
              background:#39d98a;
              transition:.25s;
            ">
          </div>

        </div>

        <div
          id="aiStatus"
          style="
            color:white;
            font-size:16px;
            font-weight:600;
            margin:14px 0;
          ">
          AI models load ho rahe hain...
        </div>

        <button
          id="aiCancel"
          style="
            padding:10px 22px;
            border-radius:10px;
            border:1px solid #52617e;
            background:#182238;
            color:white;
            cursor:pointer;
          ">
          Cancel
        </button>

      </div>

    </div>
  `;

  document.body.appendChild(box);

  document
    .getElementById("aiCancel")
    .onclick =
      closeAIVerification;

/* ---------- OBJECT HELPERS ---------- */

function objectDetected(
  predictions,
  names
){

  return predictions.some(
    p =>
      names.includes(
        p.class.toLowerCase()
      ) &&
      p.score >= 0.55
  );

}


/* ---------- POSE MOVEMENT ---------- */

function poseMovementDetected(
  pose
){

  if(!pose)
    return false;

  const points =
    pose.keypoints || [];

  const important = [
    "left_knee",
    "right_knee",
    "left_ankle",
    "right_ankle",
    "left_wrist",
    "right_wrist"
  ];

  const current = {};

  points.forEach(p => {

    if(
      important.includes(
        p.name
      ) &&
      p.score > 0.35
    ){

      current[p.name] = {
        x:p.x,
        y:p.y
      };

    }

  });

  if(!lastPose){

    lastPose =
      current;

    return false;
  }

  let movement = 0;
  let count = 0;

  important.forEach(name => {

    if(
      current[name] &&
      lastPose[name]
    ){

      movement +=
        Math.hypot(
          current[name].x -
            lastPose[name].x,

          current[name].y -
            lastPose[name].y
        );

      count++;

    }

  });

  lastPose =
    current;

  if(!count)
    return false;

  return (
    movement / count
  ) > 12;

}


/* ---------- TASK VERIFICATION ---------- */

async function verifyTaskFrame(
  task,
  video
){

  const type =
    getTaskType(task);

  const predictions =
    await aiObjectModel.detect(
      video
    );

  let pose =
    null;

  try{

    const poses =
      await aiPoseModel.estimatePoses(
        video
      );

    pose =
      poses[0] || null;

  }catch(e){

    console.log(
      "Pose error:",
      e
    );

  }


  const person =
    predictions.some(
      p =>
        p.class === "person" &&
        p.score >= .55
    );


  if(!person){

    return {
      valid:false,
      reason:
        "Person camera ke saamne nahi mila."
    };

  }


  /* RUNNING */

  if(type === "running"){

    const moving =
      poseMovementDetected(
        pose
      );

    return {
      valid:moving,
      reason:
        moving
          ? "🏃 Running movement detected."
          : "🏃 Running movement chahiye."
    };

  }


  /* EXERCISE */

  if(type === "exercise"){

    const moving =
      poseMovementDetected(
        pose
      );

    return {
      valid:moving,
      reason:
        moving
          ? "💪 Exercise movement detected."
          : "💪 Exercise movement chahiye."
    };

  }


  /* WATER */

  if(type === "water"){

    const bottle =
      objectDetected(
        predictions,
        ["bottle"]
      );

    const cup =
      objectDetected(
        predictions,
        ["cup"]
      );

    return {
      valid:
        bottle || cup,

      reason:
        bottle || cup
          ? "💧 Bottle/glass detected."
          : "💧 Bottle ya glass camera mein dikhao."
    };

  }


  /* STUDY */

  if(type === "study"){

    /*
       COCO-SSD does not reliably provide
       a 'book' class.

       So require a person and a
       book/notebook-like rectangular
       object near the lower part
       of the frame.
    */

    const laptop =
      objectDetected(
        predictions,
        ["laptop"]
      );

    /*
       Laptop is NOT treated as a book.
       This is intentionally strict.
    */

    return {
      valid:false,
      reason:
        "📚 Book/notebook verification ke liye dedicated book model chahiye."
    };

  }


  /* GENERAL */

  return {
    valid:true,
    reason:
      "✅ Person detected."
  };

}


/* ---------- START ---------- */

async function startAIVerification(
  k,
  task
){

  if(verificationRunning)
    return;

  verificationRunning =
    true;

  verificationKey =
    k;

  verificationProgress =
    0;

  createVerificationUI(
    task
  );

  const status =
    document.getElementById(
      "aiStatus"
    );

  const progress =
    document.getElementById(
      "aiProgress"
    );

  const video =
    document.getElementById(
      "aiVerificationVideo"
    );

  try{

    status.textContent =
      "AI models load ho rahe hain...";

    await loadAIModels();

    status.textContent =
      "Camera permission do...";

    verificationStream =
      await navigator.mediaDevices
        .getUserMedia({

          video:{
            facingMode:"user",
            width:{ideal:640},
            height:{ideal:480}
          },

          audio:false

        });

    video.srcObject =
      verificationStream;

    await video.play();

    status.textContent =
      "Activity verify ho rahi hai...";

    verificationTimer =
      setInterval(
        async ()=>{

          if(
            !verificationRunning ||
            !verificationKey
          )
            return;

          const currentStatus =
            getVerificationStatus(
              task,
              verificationKey.split("|")[1]
            );

          if(
            currentStatus !== "window"
          ){

            closeAIVerification();

            return;
          }

          const result =
            await verifyTaskFrame(
              task,
              video
            );

          status.textContent =
            result.reason;

          if(result.valid){

            verificationProgress += 5;

          }else{

            verificationProgress =
              Math.max(
                0,
                verificationProgress - 1
              );

          }

          progress.style.width =
            Math.min(
              100,
              verificationProgress
            ) + "%";


          if(
            verificationProgress >= 100
          ){

            clearInterval(
              verificationTimer
            );

            verificationTimer =
              null;

            status.textContent =
              "✅ Verification successful!";

            progress.style.width =
              "100%";

            /*
               IMPORTANT:
               close first, then save once.
            */

            const savedKey =
              verificationKey;

            closeAIVerification();

            if(
              marks[savedKey] !== 1
            ){

              await saveMark(
                savedKey,
                1
              );

            }

            render();

          }

        },
        1000
      );

  }catch(error){

    console.error(
      "AI verification:",
      error
    );

    status.textContent =
      "❌ Camera/AI start nahi hua.";

    const box =
      document.getElementById(
        "aiVerificationBox"
      );

    if(box){

      const p =
        document.createElement(
          "p"
        );

      p.style.color =
        "#ff7b7b";

      p.textContent =
        error.message ||
        "Camera permission allow karo.";

      box
        .querySelector(
          "#aiStatus"
        )
        .appendChild(p);

    }

  }

}

/*
   Basic camera movement verification.

   Ye camera frames ke beech movement detect karta hai.
   Ye kisi person ko 100% "running" prove nahi karta.
*/
async function startCameraVerification(k){

  if(verificationRunning) return;

  verificationRunning = true;

  createVerificationBox();

  const video =
    document.getElementById("verifyVideo");

  const message =
    document.getElementById("verifyMessage");

  const status =
    document.getElementById("verifyStatus");

  const progress =
    document.getElementById("verifyProgress");

  try{

    verificationStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{ideal:640},
          height:{ideal:480}
        },

        audio:false

      });

    video.srcObject = verificationStream;

    await video.play();

    message.textContent =
      "Camera on hai. Ab activity karo.";

    status.textContent =
      "Movement detect ho raha hai...";

    const canvas =
      document.createElement("canvas");

    const ctx =
      canvas.getContext("2d");

    canvas.width = 160;
    canvas.height = 120;

    let previousFrame = null;

    let movementScore = 0;

    const requiredScore = 35;

    verificationTimer =
      setInterval(async ()=>{

        if(!video.videoWidth) return;

        ctx.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const frame =
          ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );

        if(previousFrame){

          let difference = 0;

          for(
            let i=0;
            i<frame.data.length;
            i+=16
          ){

            difference +=
              Math.abs(
                frame.data[i] -
                previousFrame.data[i]
              );

          }

          difference /=
            (frame.data.length / 16);

          /*
             Threshold intentionally moderate,
             so normal camera movement can count.
          */

          if(difference > 12){

            movementScore += 2;

          }else{

            movementScore =
              Math.max(
                0,
                movementScore - .5
              );

          }

          const percent =
            Math.min(
              100,
              (movementScore /
              requiredScore) * 100
            );

          progress.style.width =
            percent + "%";

          status.textContent =
            `Activity detected: ${Math.round(percent)}%`;

          if(movementScore >= requiredScore){

            clearInterval(verificationTimer);

            verificationTimer = null;

            status.textContent =
              "✅ Verification successful!";

            progress.style.width =
              "100%";

            setTimeout(async ()=>{

              closeVerification();

              /*
                 Automatically mark COMPLETE.
              */

              await saveMark(k,1);

            },800);

          }

        }

        previousFrame =
          frame;

      },500);

  }catch(error){

    console.error(error);

    message.textContent =
      "Camera permission required.";

    status.textContent =
      "Camera allow karo aur dobara try karo.";

  }

}

async function saveMark(k,value){

  const [taskId,date] =
    k.split("|");

  try{

    if(value === 0){

      const {error} =
        await db
          .from("marks")
          .delete()
          .eq("user_id",user.id)
          .eq("task_id",taskId)
          .eq("mark_date",date);

      if(error) throw error;

      return;
    }


    const completed =
      value === 1;


    const {error} =
      await db
        .from("marks")
        .upsert({
          user_id:user.id,
          task_id:taskId,
          mark_date:date,
          completed:completed
        },{
          onConflict:
            "user_id,task_id,mark_date"
        });

    if(error) throw error;

  }catch(err){

    console.error(err);

    alert(
      "Mark save nahi hua: " +
      err.message
    );

  }

}

/* =========================================================
   STATS
   ========================================================= */

function updateStats(y,m,days){

  let total = 0;
  let yes = 0;
  let no = 0;

  tasks.forEach(t => {

    for(let d=1;d<=days;d++){

      const k =
        `${t.id}|${y}-${pad(m+1)}-${pad(d)}`;

      const value =
        marks[k] || 0;

      if(value === 1){

        yes++;
        total++;

      }else if(value === 2){

        no++;
        total++;

      }

    }

  });


  const rate =
    total === 0
      ? 0
      : Math.round((yes/total)*100);


  document.querySelector("#rate")
    .textContent = rate + "%";

  document.querySelector("#done")
    .textContent = yes;

  document.querySelector("#miss")
    .textContent = no;


  let best = 0;

  tasks.forEach(t => {

    let current = 0;

    for(let d=1;d<=days;d++){

      const k =
        `${t.id}|${y}-${pad(m+1)}-${pad(d)}`;

      if(marks[k] === 1){

        current++;
        best =
          Math.max(best,current);

      }else{

        current = 0;
      }
    }

  });


  document.querySelector("#streak")
    .textContent = best;

}

/* =========================================================

   ========================================================= */

function esc(s){

  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
