<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Timetable Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#080d1a;
  --card:#111a2d;
  --card2:#18233b;
  --text:#f4f7ff;
  --muted:#8d9ab5;
  --line:#263552;
  --accent:#6366f1;
  --accent2:#818cf8;
  --good:#22c55e;
  --bad:#ef4444;
  --pending:#64748b;
}

*{box-sizing:border-box}

body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:var(--text)}
  background:
    radial-gradient(circle at 15% 0%,#202b61 0%,transparent 35%),
    radial-gradient(circle at 90% 100%,#172554 0%,transparent 35%),
    var(--bg);
}

button,input{font:inherit}

button{
  cursor:pointer;
  color:var(--text);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:11px;
  padding:10px 14px;
  transition:.2s;
}

button:hover{
  border-color:var(--accent2);
  background:var(--card2);
}

input{
  width:100%;
  color:var(--text);
  background:#0d1527;
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px 14px;
  outline:none;
}

input::placeholder{color:#64748b}

input:focus{
  border-color:var(--accent2);
  box-shadow:0 0 0 3px rgba(99,102,241,.14);
}

.wrap{
  width:min(1200px,94%);
  margin:auto;
  padding:30px 0 50px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:25px;
}

h1{
  margin:0;
  font-size:30px;
  font-weight:800;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
}

.controls{
  display:flex;
  gap:9px;
  align-items:center;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:18px;
}

.stat{
  padding:20px;
  border:1px solid var(--line);
  border-radius:16px;
  background:linear-gradient(145deg,var(--card),#0d1527);
  box-shadow:0 12px 30px rgba(0,0,0,.2);
}

.stat b{
  display:block;
  font-size:28px;
  margin-bottom:4px;
}

.stat span{
  color:var(--muted);
  font-size:13px;
}

.panel{
  padding:20px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(17,26,45,.9);
  box-shadow:0 18px 45px rgba(0,0,0,.22);
}

.bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.bar strong{font-size:18px}

#add{
  display:flex;
  gap:9px;
  align-items:center;
}

#add input{width:190px}

#add button{
  background:linear-gradient(135deg,var(--accent),#4f46e5);
  border:0;
  font-weight:700;
}

.table-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:14px;
}

table{
  width:100%;
  min-width:1000px;
  border-collapse:separate;
  border-spacing:0;
}

th{
  padding:12px 8px;
  background:#0e1729;
  color:#aeb9d0;
  font-size:12px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}

td{
  height:50px;
  text-align:center;
  background:#10192c;
  border-right:1px solid #1d2942;
  border-bottom:1px solid #1d2942;
}

td:last-child,th:last-child{border-right:0}

.task-name{
  min-width:150px;
  text-align:left;
  padding-left:14px;
  font-weight:700;
}

.task-time{
  min-width:100px;
  color:var(--muted);
  font-size:12px;
}

.cell{
  width:42px;
  height:42px;
  padding:0;
  border:1px solid transparent;
  border-radius:10px;
  background:transparent;
  color:var(--pending);
  font-weight:800;
  font-size:17px;
}

.cell:hover{
  background:#1d293e;
  border-color:#334155;
}

.cell.complete{
  color:#4ade80;
  background:rgba(34,197,94,.1);
  border-color:rgba(34,197,94,.25);
}

.cell.missed{
  color:#f87171;
  background:rgba(239,68,68,.1);
  border-color:rgba(239,68,68,.25);
}

.cell.today{
  box-shadow:inset 0 0 0 2px var(--accent);
}

.del{
  color:#f87171;
  background:transparent;
  border:0;
  font-size:12px;
}

.empty{
  color:var(--muted);
  padding:35px 15px;
  text-align:center;
}

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:min(420px,100%);
  padding:30px;
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(17,26,45,.95);
  box-shadow:0 25px 70px rgba(0,0,0,.4);
}

.login-card h1{
  font-size:27px;
  margin-bottom:8px;
}

.login-card p{
  color:var(--muted);
  font-size:14px;
  margin:0 0 22px;
}

.login-card input{
  margin-bottom:11px;
}

.login-card button{
  width:100%;
  background:linear-gradient(135deg,var(--accent),#4f46e5);
  border:0;
  font-weight:700;
}

.switch{
  margin-top:15px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  cursor:pointer;
}

.switch:hover{color:var(--accent2)}

.user-area{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:13px;
}

#logout{
  padding:8px 12px;
}

.hidden{display:none!important}

@media(max-width:800px){
  .top{
    flex-direction:column;
    align-items:flex-start;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .bar{
    flex-direction:column;
    align-items:stretch;
  }

  #add{
    flex-wrap:wrap;
  }

  #add input{
    flex:1;
    min-width:130px;
  }
}

@media(max-width:480px){
  .wrap{padding-top:20px}

  h1{font-size:24px}

  .stats{
    gap:9px;
  }

  .stat{
    padding:14px;
  }

  .stat b{font-size:22px}

  .panel{padding:12px}

  .user-area{
    flex-direction:column;
    align-items:flex-start;
  }
}.cell.locked{
  opacity:.45;
  cursor:not-allowed;
}

.cell.verify{
  color:#facc15;
  background:rgba(250,204,21,.10);
  border-color:rgba(250,204,21,.25);
}

.cell.auto-missed{
  color:#f87171;
  background:rgba(239,68,68,.10);
  border-color:rgba(239,68,68,.25);
}
</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">

    <h1>📅 My Timetable Tracker</h1>
    <p id="loginText">Login karke apna tracker open karo.</p>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="authBtn">Login</button>

    <div id="switchAuth" class="switch">
      Account nahi hai? Signup
    </div>

  </div>
</div>

<div id="app" class="hidden">

<div class="wrap">

  <div class="top">

    <div>
      <h1>📅 My Timetable Tracker</h1>
      <div class="sub">
        ✓ = complete &nbsp; X = missed &nbsp; — = not marked
      </div>
    </div>

    <div class="user-area">
      <span id="userEmail"></span>
      <button id="logout">Logout</button>
    </div>

  </div>

  <div class="controls" style="justify-content:center;margin-bottom:18px">
    <button id="prev">‹</button>
    <input id="month" type="month">
    <button id="next">›</button>
  </div>

  <div class="stats">

    <div class="stat">
      <b id="rate">0%</b>
      <span>Monthly completion</span>
    </div>

    <div class="stat">
      <b id="done">0</b>
      <span>Completed</span>
    </div>

    <div class="stat">
      <b id="miss">0</b>
      <span>Missed</span>
    </div>

    <div class="stat">
      <b id="streak">0</b>
      <span>Best streak</span>
    </div>

  </div>

  <div class="panel">

    <div class="bar">

      <strong id="monthTitle">August 2026</strong>

      <form id="add">

        <input
          id="task"
          placeholder="Task / subject"
          required
        >

        <input
          id="time"
          placeholder="Time (e.g. 7:00 AM)"
          required
        >

        <button type="submit">+ Add task</button>

      </form>

    </div>

    <div id="grid" class="table-wrap"></div>

  </div>

</div>
</div>

<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL = "https://acsokyrhfequnuvtmomx.supabase.co";
const SUPABASE_KEY = "sb_publishable_q5tlkRgV8Yv377vmWr8sHw_ZGKfWMPi";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   APP STATE
   ========================================================= */

let user = null;
let tasks = [];
let marks = {};

let view = new Date();
view.setDate(1);

const pad = n => String(n).padStart(2,"0");

const dateKey = d =>
  `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;


/* =========================================================
   ELEMENTS
   ========================================================= */

const loginScreen = document.querySelector("#loginScreen");
const app = document.querySelector("#app");

const emailInput = document.querySelector("#email");
const passwordInput = document.querySelector("#password");

const authBtn = document.querySelector("#authBtn");
const switchAuth = document.querySelector("#switchAuth");
const loginText = document.querySelector("#loginText");

const userEmail = document.querySelector("#userEmail");
const logoutBtn = document.querySelector("#logout");

const monthInput = document.querySelector("#month");
const monthTitle = document.querySelector("#monthTitle");

const taskInput = document.querySelector("#task");
const timeInput = document.querySelector("#time");

const grid = document.querySelector("#grid");

let signupMode = false;


/* =========================================================
   LOGIN / SIGNUP
   ========================================================= */

switchAuth.onclick = () => {

  signupMode = !signupMode;

  if(signupMode){

    loginText.textContent =
      "Naya account create karo.";

    authBtn.textContent = "Signup";

    switchAuth.textContent =
      "Already account hai? Login";

  }else{

    loginText.textContent =
      "Login karke apna tracker open karo.";

    authBtn.textContent = "Login";

    switchAuth.textContent =
      "Account nahi hai? Signup";
  }

};


authBtn.onclick = async () => {

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if(!email || !password){
    alert("Email aur password dono bharo.");
    return;
  }

  authBtn.disabled = true;

  try{

    if(signupMode){

      const {data,error} =
        await db.auth.signUp({
          email,
          password
        });

      if(error) throw error;

      if(data.session){

        await startApp(data.session.user);

      }else{

        alert(
          "Signup successful. Agar email confirmation enabled hai to email verify karke login karo."
        );

        signupMode = false;
        switchAuth.click();
      }

    }else{

      const {data,error} =
        await db.auth.signInWithPassword({
          email,
          password
        });

      if(error) throw error;

      await startApp(data.user);
    }

  }catch(err){

    alert(err.message);

  }finally{

    authBtn.disabled = false;
  }

};


/* =========================================================
   LOGOUT
   ========================================================= */

logoutBtn.onclick = async () => {

  await db.auth.signOut();

  user = null;
  tasks = [];
  marks = {};

  app.classList.add("hidden");
  loginScreen.classList.remove("hidden");

};


/* =========================================================
   START APP
   ========================================================= */

async function startApp(currentUser){

  user = currentUser;

  userEmail.textContent =
    user.email || "";

  loginScreen.classList.add("hidden");
  app.classList.remove("hidden");

  await loadData();

  render();
}


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadData(){

  if(!user) return;

  try{

    const {data:taskData,error:taskError}
      = await db
        .from("tasks")
        .select("*")
        .eq("user_id",user.id)
        .order("created_at",{ascending:true});

    if(taskError) throw taskError;

    tasks = taskData || [];


    const {data:markData,error:markError}
      = await db
        .from("marks")
        .select("*")
        .eq("user_id",user.id);

    if(markError) throw markError;

    marks = {};

    (markData || []).forEach(m => {

      const taskId = m.task_id;

      const date =
        m.mark_date;

      let value = null;

      if(m.completed === true){
        value = 1;
      }else if(m.completed === false){
        value = 2;
      }

      marks[`${taskId}|${date}`] = value;

    });

  }catch(err){

    console.error(err);

    alert(
      "Data load nahi hua: " + err.message
    );
  }

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

  const y = view.getFullYear();
  const m = view.getMonth();

  const days =
    new Date(y,m+1,0).getDate();

  monthInput.value =
    `${y}-${pad(m+1)}`;

  monthTitle.textContent =
    view.toLocaleDateString("en-IN",{
      month:"long",
      year:"numeric"
    });


  let h = `
    <table>
      <thead>
        <tr>
          <th>Task</th>
          <th>Time</th>
  `;

  for(let d=1;d<=days;d++){

    h += `<th>${d}</th>`;
  }

  h += `
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
  `;


  if(tasks.length === 0){

    h += `
      <tr>
        <td colspan="${days+3}" class="empty">
          Abhi koi task nahi hai.<br>
          Upar se task add karo 👆
        </td>
      </tr>
    `;

  }else{

    tasks.forEach(t => {

      h += `
        <tr>

          <td class="task-name">
            ${esc(t.name)}
          </td>

          <td class="task-time">
            ${esc(t.time)}
          </td>
      `;


      for(let d=1;d<=days;d++){

        const k =
          `${t.id}|${y}-${pad(m+1)}-${pad(d)}`;

        const value =
          marks[k] || 0;

        const date =
          new Date(y,m,d);

        const today =
          dateKey(new Date()) === dateKey(date);

        let text = "—";
        let cls = "cell";

        if(value === 1){

          text = "✓";
          cls += " complete";

        }else if(value === 2){

          text = "X";
          cls += " missed";
        }

        if(today){
          cls += " today";
        }

        h += `
          <td>
            <button
              class="${cls}"
              data-k="${k}"
              aria-label="${text}"
            >${text}</button>
          </td>
        `;
      }


      h += `
          <td>
            <button
              class="del"
              data-del="${t.id}"
            >Delete</button>
          </td>

        </tr>
      `;
    });

  }

  h += `
      </tbody>
    </table>
  `;

  grid.innerHTML = h;


  /* MARK BUTTONS */

  document.querySelectorAll("[data-k]")
    .forEach(btn => {

      btn.onclick = async () => {

        const k = btn.dataset.k;

        const current =
          marks[k] || 0;

        /*
          0 = not marked
          1 = complete
          2 = missed
        */

        const next =
          current === 0 ? 1 :
          current === 1 ? 2 :
          0;

        marks[k] = next;

        render();

        await saveMark(k,next);
      };

    });


  /* DELETE BUTTONS */

  document.querySelectorAll("[data-del]")
    .forEach(btn => {

      btn.onclick = async () => {

        const id =
          btn.dataset.del;

        if(!confirm("Task delete karna hai?"))
          return;

        await deleteTask(id);
      };

    });


  updateStats(y,m,days);

}


/* =========================================================
   SAVE MARK
   ========================================================= */
/* =========================================================
   VERIFICATION WINDOW
   ========================================================= */

const VERIFICATION_MINUTES = 30;

function parseTaskTime(value){

  if(!value) return null;

  let text = String(value).trim().toUpperCase();

  let match = text.match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?$/);

  if(!match) return null;

  let hour = Number(match[1]);
  let minute = Number(match[2] || 0);
  let ampm = match[3];

  if(ampm){

    if(hour < 1 || hour > 12) return null;

    if(ampm === "AM" && hour === 12)
      hour = 0;

    if(ampm === "PM" && hour !== 12)
      hour += 12;

  }else{

    if(hour > 23 || minute > 59)
      return null;

  }

  return hour * 60 + minute;
}


function getVerificationStatus(task,date){

  const mark = marks[`${task.id}|${date}`];

  if(mark === 1)
    return "done";

  const taskMinutes = parseTaskTime(task.time);

  if(taskMinutes === null)
    return "before";

  const target = new Date(`${date}T00:00:00`);

  target.setHours(
    Math.floor(taskMinutes / 60),
    taskMinutes % 60,
    0,
    0
  );

  const start = target.getTime();
  const end =
    start + VERIFICATION_MINUTES * 60 * 1000;

  const now = Date.now();

  if(target.toDateString() !== new Date().toDateString()){

    if(target > new Date())
      return "future";

    return "expired";
  }

  if(now < start)
    return "before";

  if(now >= start && now <= end)
    return "window";

  return "expired";
}


async function markAsMissed(taskId,date){

  const k = `${taskId}|${date}`;

  if(marks[k] === 1)
    return;

  marks[k] = 2;

  render();

  await saveMark(k,2);
}


function checkExpiredTasks(){

  if(!user || !tasks.length)
    return;

  const today = dateKey(new Date());

  tasks.forEach(task => {

    const status =
      getVerificationStatus(task,today);

    if(status === "expired"){

      const k = `${task.id}|${today}`;

      if(!marks[k])
        markAsMissed(task.id,today);

    }

  });

}


setInterval(checkExpiredTasks,30000);
async function saveMark(k,value){

  const [taskId,date] =
    k.split("|");

  try{

    if(value === 0){

      const {error} =
        await db
          .from("marks")
          .delete()
          .eq("user_id",user.id)
          .eq("task_id",taskId)
          .eq("mark_date",date);

      if(error) throw error;

      return;
    }


    const completed =
      value === 1;


    const {error} =
      await db
        .from("marks")
        .upsert({
          user_id:user.id,
          task_id:taskId,
          mark_date:date,
          completed:completed
        },{
          onConflict:
            "user_id,task_id,mark_date"
        });

    if(error) throw error;

  }catch(err){

    console.error(err);

    alert(
      "Mark save nahi hua: " +
      err.message
    );

  }

}


/* =========================================================
   ADD TASK
   ========================================================= */

document.querySelector("#add").onsubmit =
async e => {

  e.preventDefault();

  const name =
    taskInput.value.trim();

  const time =
    timeInput.value.trim();

  if(!name || !time) return;

  try{

    const {data,error} =
      await db
        .from("tasks")
        .insert({
          user_id:user.id,
          name:name,
          time:time
        })
        .select()
        .single();

    if(error) throw error;

    tasks.push(data);

    taskInput.value = "";
    timeInput.value = "";

    render();

  }catch(err){

    console.error(err);

    alert(
      "Task add nahi hua: " +
      err.message
    );

  }

};


/* =========================================================
   DELETE TASK
   ========================================================= */

async function deleteTask(id){

  try{

    const {error} =
      await db
        .from("tasks")
        .delete()
        .eq("id",id)
        .eq("user_id",user.id);

    if(error) throw error;

    tasks =
      tasks.filter(t => t.id !== id);

    Object.keys(marks)
      .filter(k => k.startsWith(id+"|"))
      .forEach(k => delete marks[k]);

    render();

  }catch(err){

    console.error(err);

    alert(
      "Task delete nahi hua: " +
      err.message
    );

  }

}


/* =========================================================
   STATS
   ========================================================= */

function updateStats(y,m,days){

  let total = 0;
  let yes = 0;
  let no = 0;

  tasks.forEach(t => {

    for(let d=1;d<=days;d++){

      const k =
        `${t.id}|${y}-${pad(m+1)}-${pad(d)}`;

      const value =
        marks[k] || 0;

      if(value === 1){

        yes++;
        total++;

      }else if(value === 2){

        no++;
        total++;

      }

    }

  });


  const rate =
    total === 0
      ? 0
      : Math.round((yes/total)*100);


  document.querySelector("#rate")
    .textContent = rate + "%";

  document.querySelector("#done")
    .textContent = yes;

  document.querySelector("#miss")
    .textContent = no;


  let best = 0;

  tasks.forEach(t => {

    let current = 0;

    for(let d=1;d<=days;d++){

      const k =
        `${t.id}|${y}-${pad(m+1)}-${pad(d)}`;

      if(marks[k] === 1){

        current++;
        best =
          Math.max(best,current);

      }else{

        current = 0;
      }
    }

  });


  document.querySelector("#streak")
    .textContent = best;

}


/* =========================================================
   MONTH NAVIGATION
   ========================================================= */

document.querySelector("#prev").onclick =
() => {

  view.setMonth(view.getMonth()-1);
  render();

};


document.querySelector("#next").onclick =
() => {

  view.setMonth(view.getMonth()+1);
  render();

};


monthInput.onchange = () => {

  const [y,m] =
    monthInput.value
      .split("-")
      .map(Number);

  view =
    new Date(y,m-1,1);

  render();

};


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function esc(s){

  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   CHECK EXISTING SESSION
   ========================================================= */

(async function(){

  try{

    const {
      data:{session}
    } = await db.auth.getSession();

    if(session){

      await startApp(session.user);

    }

  }catch(err){

    console.error(err);

  }

})();


/* =========================================================
   AUTH STATE LISTENER
   ========================================================= */

db.auth.onAuthStateChange(
  async (event,session) => {

    if(session && !user){

      await startApp(session.user);

    }

  }
);
