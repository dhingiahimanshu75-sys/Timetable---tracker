<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Timetable Tracker</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script><style>body{margin:0;background:#070b15;color:#f4f7ff;font:14px system-ui}.wrap{max-width:1150px;width:94%;margin:auto;padding:25px}.box{background:#111a2d;border:1px solid #263552;border-radius:15px;padding:16px;margin:12px 0}button,input{font:inherit}button{color:white;background:#111a2d;border:1px solid #263552;border-radius:9px;padding:9px 12px;cursor:pointer}button:disabled{opacity:.5}input{background:#0d1527;color:white;border:1px solid #263552;border-radius:9px;padding:9px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.muted{color:#8d9ab5}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{padding:12px;background:#0d1527;border:1px solid #263552;border-radius:12px}.stat b{font-size:20px;display:block}.table{overflow:auto}.table table{border-collapse:collapse;min-width:900px;width:100%}th,td{border:1px solid #263552;padding:7px;text-align:center}th{background:#0d1527;color:#aeb9d0}.name{text-align:left;min-width:150px}.ok{color:#4ade80}.bad{color:#f87171}.verify{color:#facc15}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login>div{width:min(400px,100%)}.hidden{display:none}.overlay{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:15px;z-index:99}.modal{background:#101827;border:1px solid #34415d;border-radius:18px;padding:15px;width:min(650px,96vw);text-align:center}.modal video{width:100%;max-height:420px;border-radius:12px;background:#000}.modal canvas{display:none}.status{padding:9px;border:1px solid #263552;border-radius:10px;background:#0b1323;margin:10px 0}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.progress{height:10px;background:#273248;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#39d98a}@media(max-width:700px){.row{flex-direction:column;align-items:stretch}.stats{grid-template-columns:repeat(2,1fr)}} </style></head><body><div id="login" class="login"><div class="box"><h1>📅 My Timetable Tracker</h1><p class="muted">Login karke apna tracker open karo.</p><div id="err" class="hidden"></div><input id="email" type="email" placeholder="Email" style="width:100%;margin:6px 0"><input id="pass" type="password" placeholder="Password" style="width:100%;margin:6px 0"><button id="auth" style="width:100%;margin-top:6px">Login</button><button id="signup" style="width:100%;margin-top:8px">Signup</button></div></div><div id="app" class="hidden"><div class="wrap"><div class="row"><div><h1>📅 My Timetable Tracker</h1><div class="muted">✓ complete • X missed • 📸 photo verification</div></div><div class="row"><span id="who" class="muted"></span><button id="logout">Logout</button></div></div><div class="box"><b id="rank">😎 Chutiya</b><div id="lives" class="muted">❤️❤️❤️ 3 lives</div></div><div class="stats"><div class="stat"><b id="rate">0%</b><span>Completion</span></div><div class="stat"><b id="done">0</b><span>Completed</span></div><div class="stat"><b id="miss">0</b><span>Missed</span></div><div class="stat"><b id="streak">0</b><span>Streak</span></div><div class="stat"><b id="xp">0</b><span>XP</span></div></div><div class="row"><button id="prev">‹</button><input id="month" type="month"><button id="next">›</button></div><div class="box"><div class="row"><b id="title"></b><form id="add" class="row"><input id="task" placeholder="Task" required><input id="time" type="time" required><button>Add</button></form></div><div id="grid" class="table" style="margin-top:12px"></div></div></div></div><audio id="voice" src="./tick-voice.wav"></audio><script>"use strict";const db=supabase.createClient("https://acsokyrhfequnuvtmomx.supabase.co","sb_publishable_q5tlkRgV8Yv377vmWr8sHw_ZGKfWMPi");const $=s=>document.querySelector(s);let user=null,profile=null,tasks=[],marks={},view=new Date(),stream=null,camMode="environment",model=null,verifying=false;view.setDate(1);const pad=n=>String(n).padStart(2,"0"),today=()=>{let d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`},key=(t,d)=>`${t.id}|${d}`,esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])),types=t=>{let s=(t.name||"").toLowerCase();return /water|paani|pani|drink|hydration|पानी/.test(s)?"water":/study|padhai|book|read|पढ़ाई/.test(s)?"study":/running|run|jog/.test(s)?"running":/exercise|workout|gym|push.?up|squat|yoga/.test(s)?"exercise":"general"};function tm(v){let m=String(v||"").match(/^(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null}function state(t,d){let k=key(t,d),v=marks[k]||0;if(v===1)return"done";if(v===2)return"expired";let m=tm(t.time);if(m==null)return"window";let z=new Date(`${d}T00:00:00`);z.setHours(Math.floor(m/60),m%60,0,0);let n=Date.now(),a=z.getTime();if(d!==today())return a>n?"future":"expired";return n<a?"future":n<=a+1800000?"window":"expired"}async function load(){let a=await db.from("tasks").select("*").eq("user_id",user.id).order("created_at");if(a.error)throw a.error;tasks=a.data||[];let b=await db.from("marks").select("*").eq("user_id",user.id);if(b.error)throw b.error;marks={};(b.data||[]).forEach(x=>marks[`${x.task_id}|${x.mark_date}`]=x.completed?1:2)}async function saveMark(k,v){let[t,d]=k.split("|");let r=await db.from("marks").upsert({user_id:user.id,task_id:t,mark_date:d,completed:v===1},{onConflict:"user_id,task_id,mark_date"});if(r.error)throw r.error;marks[k]=v}function render(){let y=view.getFullYear(),m=view.getMonth(),days=new Date(y,m+1,0).getDate();$("#month").value=`${y}-${pad(m+1)}`;$("#title").textContent=view.toLocaleDateString("en-IN",{month:"long",year:"numeric"});let h="<table><tr><th>Task</th><th>Time</th>";for(let d=1;d<=days;d++)h+=`<th>${d}</th>`;h+="</tr>";for(let t of tasks){h+=`<tr><td class=name>${esc(t.name)}</td><td>${esc(t.time||"")}</td>`;for(let d=1;d<=days;d++){let date=`${y}-${pad(m+1)}-${pad(d)}`,k=key(t,date),v=marks[k]||0,s=state(t,date),c=v===1?"ok":v===2?"bad":s==="window"?"verify":"";h+=`<td><button class="${c}" data-k="${esc(k)}">${v===1?"✓":v===2?"X":"—"}</button></td>`}h+="</tr>"}$("#grid").innerHTML=h+"</table>";let c=0,x=0,b=0,s=0;for(let d=1;d<=days;d++){let all=tasks.length>0;for(let t of tasks){let v=marks[key(t,`${y}-${pad(m+1)}-${pad(d)}`)]||0;if(v===1)c++;if(v===2)x++;if(v!==1)all=false}if(all){s++;b=Math.max(b,s)}else s=0}let total=c+x;$("#rate").textContent=(total?Math.round(c/total*100):0)+"%";$("#done").textContent=c;$("#miss").textContent=x;$("#streak").textContent=b;$("#xp").textContent=c*10+b*25;ui();document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let[id,d]=b.dataset.k.split('|'),t=tasks.find(x=>String(x.id)===id);if(!t)return;let s=state(t,d);if(s==='window')openVerify(b.dataset.k,t);else if(s==='future')alert('Abhi iska time nahi hua.');else if(s==='expired'&&!marks[b.dataset.k])alert('Verification window expire ho gayi.');})}function ui(){let r=profile?.rank||"A",l=Number(profile?.lives??3);$("#rank").textContent=r==="A"?"😎 Chutiya":r==="-A"?"🤡 Gandu":"🏆 Rank "+r;$("#lives").textContent=(l?"❤️".repeat(l):"💔")+` ${l} lives`}async function openProfile(){let r=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();if(r.error)throw r.error;if(r.data)profile=r.data;else{let x=await db.from("profiles").insert({id:user.id,email:user.email,username:(user.email||"User").split('@')[0],rank:"A",lives:3}).select().single();if(x.error)throw x.error;profile=x.data}}async function start(){try{await openProfile();await load();$("#who").textContent=user.email||"";$("#login").classList.add("hidden");$("#app").classList.remove("hidden");render()}catch(e){$("#app").classList.add("hidden");$("#login").classList.remove("hidden");$("#err").textContent=e.message;$("#err").classList.remove("hidden")}}async function startCam(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:camMode},width:{ideal:1280},height:{ideal:720}},audio:false});let v=$("#cam");v.srcObject=stream;await v.play();$("#open").classList.add("hidden");$("#flip").classList.remove("hidden");$("#take").classList.remove("hidden");$("#vs").textContent="✅ Camera ready. Photo lo."}catch(e){$("#vs").textContent="❌ Camera error: "+e.message}}function openVerify(k,t){if($("#verify"))$("#verify").remove();verificationKey=k;verificationTask=t;let o=document.createElement("div");o.id="verify";o.className="overlay";o.innerHTML=`<div class=modal><h2>📸 Photo Verification</h2><div class=muted>${types(t)==='water'?"Bottle/cup clearly camera me dikhao.":types(t)==='study'?"Laptop/book camera me dikhao.":types(t)==='general'?"Khud camera me clearly dikho.":"Person/activity clearly dikhao."}</div><video id=cam autoplay muted playsinline></video><canvas id=shot></canvas><div id=vs class=status>Camera open karo.</div><div class=progress><i id=bar></i></div><div class=actions><button id=open>📷 Open Camera</button><button id=flip class=hidden>🔄 Switch Camera</button><button id=take class=hidden>📸 Take Photo</button><button id=close>Cancel</button></div></div>`;document.body.appendChild(o);$("#open").onclick=startCam;$("#flip").onclick=()=>{camMode=camMode==="environment"?"user":"environment";startCam()};$("#take").onclick=takePhoto;$("#close").onclick=closeVerify}let verificationKey="",verificationTask=null;async function takePhoto(){if(verifying)return;verifying=true;let v=$("#cam"),c=$("#shot"),s=$("#vs");try{if(!model)model=await cocoSsd.load();c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0,c.width,c.height);s.textContent="🤖 Photo verify ho rahi hai...";$("#bar").style.width="55%";let p=await model.detect(c),tp=types(verificationTask),need=tp==='water'?["bottle","cup"]:tp==='study'?["laptop","book"]:["person"],valid=false;for(let x of p)if(need.includes(x.class)&&x.score>0.18){valid=true;break}if(!valid)throw new Error(tp==='water'?"Bottle/cup detect nahi hua. Clear photo dobara lo.":"Required object detect nahi hua. Clear photo dobara lo.");await saveMark(verificationKey,1);$("#voice").currentTime=0;$("#voice").play().catch(()=>{});closeVerify();render()}catch(e){s.textContent="❌ "+e.message;$("#bar").style.width="0"}finally{verifying=false}}function closeVerify(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;let o=$("#verify");if(o)o.remove();verificationKey="";verificationTask=null;verifying=false}$("#auth").onclick=async()=>{try{let r=await db.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#pass").value});if(r.error)throw r.error;user=r.data.user;await start()}catch(e){$("#err").textContent=e.message;$("#err").classList.remove("hidden")}};$("#signup").onclick=async()=>{try{let r=await db.auth.signUp({email:$("#email").value.trim(),password:$("#pass").value});if(r.error)throw r.error;alert(r.data.session?"Signup successful":"Email verify karke login karo")}catch(e){$("#err").textContent=e.message;$("#err").classList.remove("hidden")}};$("#logout").onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(r=>{if(r.data.session){user=r.data.session.user;start()}});</script></body></html>
