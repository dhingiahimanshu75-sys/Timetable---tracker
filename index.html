<style>
:root{
  --bg:#0b1020;
  --card:#121a2e;
  --card2:#17213a;
  --text:#f1f5ff;
  --muted:#8e9ab5;
  --line:#273452;
  --accent:#6366f1;
  --accent2:#818cf8;
  --good:#22c55e;
  --bad:#ef4444;
  --pending:#64748b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at top left,#1b2550 0%,transparent 35%),
    radial-gradient(circle at bottom right,#172554 0%,transparent 35%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

.wrap{
  width:min(1200px,94%);
  margin:0 auto;
  padding:32px 0 50px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:28px;
}

h1{
  margin:0;
  font-size:30px;
  font-weight:800;
  letter-spacing:-.6px;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-top:7px;
}

.controls{
  display:flex;
  align-items:center;
  gap:10px;
}

button,
input{
  font:inherit;
}

button{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  transition:.2s ease;
}

button:hover{
  border-color:var(--accent);
  background:var(--card2);
  transform:translateY(-1px);
}

input{
  background:#0f172a;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px 13px;
  outline:none;
}

input::placeholder{
  color:#64748b;
}

input:focus{
  border-color:var(--accent2);
  box-shadow:0 0 0 3px rgba(99,102,241,.15);
}

#month{
  min-width:155px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.stat{
  background:linear-gradient(145deg,var(--card),#0f172a);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  box-shadow:0 12px 30px rgba(0,0,0,.18);
}

.stat b{
  display:block;
  font-size:27px;
  font-weight:800;
  margin-bottom:5px;
}

.stat span{
  color:var(--muted);
  font-size:13px;
}

.panel{
  background:rgba(18,26,46,.88);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  box-shadow:0 18px 45px rgba(0,0,0,.22);
  backdrop-filter:blur(10px);
}

.bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.bar strong{
  font-size:18px;
}

form#add{
  display:flex;
  gap:10px;
  align-items:center;
}

form#add input{
  min-width:180px;
}

form#add button{
  background:linear-gradient(135deg,var(--accent),#4f46e5);
  border:0;
  font-weight:700;
  box-shadow:0 8px 20px rgba(79,70,229,.25);
}

form#add button:hover{
  background:linear-gradient(135deg,#818cf8,var(--accent));
}

.table-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:14px;
  scrollbar-color:#475569 #0f172a;
}

table{
  width:100%;
  min-width:900px;
  border-collapse:separate;
  border-spacing:0;
}

th{
  background:#10182c;
  color:#aeb9d0;
  font-size:12px;
  font-weight:700;
  padding:12px 8px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}

td{
  height:48px;
  text-align:center;
  border-bottom:1px solid #1d2942;
  border-right:1px solid #1d2942;
  background:#111a2d;
}

tr:last-child td{
  border-bottom:0;
}

td:last-child,
th:last-child{
  border-right:0;
}

.task-name{
  min-width:150px;
  text-align:left;
  padding-left:14px;
  font-weight:700;
  color:#e2e8f0;
}

.task-time{
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}

.day{
  min-width:42px;
  height:42px;
  padding:0;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#64748b;
  font-size:17px;
  font-weight:700;
}

.day:hover{
  background:#1e293b;
}

.cell{
  min-width:42px;
  height:42px;
  padding:0;
  border:1px solid transparent;
  border-radius:10px;
  background:transparent;
  color:var(--pending);
  font-size:18px;
  font-weight:800;
}

.cell:hover{
  background:#1e293b;
  border-color:#334155;
}

.cell.complete{
  color:#4ade80;
  background:rgba(34,197,94,.10);
  border-color:rgba(34,197,94,.25);
}

.cell.missed{
  color:#f87171;
  background:rgba(239,68,68,.10);
  border-color:rgba(239,68,68,.25);
}

.cell.today{
  box-shadow:inset 0 0 0 2px var(--accent);
}

.del{
  color:#f87171;
  background:transparent;
  border:0;
  padding:5px 8px;
  font-size:12px;
}

.del:hover{
  background:rgba(239,68,68,.12);
  border-color:rgba(239,68,68,.25);
}

.empty{
  color:var(--muted);
  text-align:center;
  padding:35px 15px;
  font-size:14px;
}

#prev,
#next{
  width:42px;
  height:42px;
  padding:0;
  font-size:20px;
}

@media(max-width:800px){
  .wrap{
    width:94%;
    padding-top:20px;
  }

  .top{
    flex-direction:column;
    align-items:flex-start;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .bar{
    flex-direction:column;
    align-items:stretch;
  }

  form#add{
    flex-wrap:wrap;
  }

  form#add input{
    flex:1;
    min-width:140px;
  }
}

@media(max-width:480px){
  h1{
    font-size:24px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .stat{
    padding:14px;
  }

  .stat b{
    font-size:22px;
  }

  .panel{
    padding:12px;
  }
}
</style>
