<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Timetable Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f6f7fb;
  --card:#fff;
  --text:#17181c;
  --muted:#70747d;
  --line:#e5e7eb;
  --accent:#5b5ce2;
  --good:#22a060;
  --bad:#e05252;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.wrap{
  max-width:1100px;
  margin:auto;
  padding:18px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.controls{
  display:flex;
  gap:8px;
  align-items:center;
}
button,input{
  font:inherit;
}
button{
  border:1px solid var(--line);
  background:var(--card);
  border-radius:9px;
  padding:9px 13px;
  cursor:pointer;
}
button:hover{opacity:.85}
.primary{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}
.logout{
  background:#fff;
  color:var(--bad);
}
input{
  border:1px solid var(--line);
  border-radius:9px;
  padding:9px;
  background:white;
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:16px 0;
}
.stat{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
}
.stat b{
  display:block;
  font-size:22px;
}
.stat span{
  color:var(--muted);
  font-size:12px;
}
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
}
.bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}
form{
  display:flex;
  gap:8px;
}
.table-wrap{
  overflow:auto;
}
table{
  border-collapse:separate;
  border-spacing:0;
  min-width:900px;
  width:100%;
}
th,td{
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:4px;
  text-align:center;
}
th:first-child,td:first-child{
  border-left:1px solid var(--line);
}
thead th{
  border-top:1px solid var(--line);
}
.day{
  min-width:34px;
}
.cell{
  width:32px;
  height:32px;
  padding:0;
  border-radius:8px;
  font-weight:700;
}
.none{background:transparent}
.yes{
  background:#dff5e8;
  color:var(--good);
}
.no{
  background:#ffe2e2;
  color:var(--bad);
}
.today{
  outline:2px solid var(--accent);
}
.task-name{
  font-weight:600;
  font-size:13px;
  text-align:left;
}
.task-time{
  font-size:11px;
  color:var(--muted);
}
.del{
  color:var(--bad);
  border:0;
  background:transparent;
  padding:3px 5px;
}
.empty{
  padding:28px;
  text-align:center;
  color:var(--muted);
}
#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.auth{
  width:min(400px,100%);
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:24px;
  box-shadow:0 10px 30px #0000000d;
}
.auth h1{
  margin-bottom:6px;
}
.auth p{
  color:var(--muted);
  font-size:13px;
}
.auth input{
  width:100%;
  margin:6px 0;
}
.auth button{
  width:100%;
  margin-top:8px;
}
.auth .switch{
  background:transparent;
  border:0;
  color:var(--accent);
}
#app{display:none}
.message{
  min-height:20px;
  margin-top:8px;
  font-size:13px;
  color:var(--bad);
}
.userbox{
  display:flex;
  align-items:center;
  gap:8px;
}
@media(max-width:650px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .top{align-items:flex-start}
  h1{font-size:21px}
  form{flex-wrap:wrap}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="auth">
    <h1>📅 My Timetable Tracker</h1>
    <p id="authText">Login karke apna tracker open karo.</p>

    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">

    <button id="authBtn" class="primary">Login</button>
    <button id="switchBtn" class="switch">Account nahi hai? Signup</button>

    <div id="authMsg" class="message"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
<div class="wrap">

  <div class="top">
    <div>
      <h1>📅 My Timetable Tracker</h1>
      <div class="sub">✓ = complete &nbsp; X = missed &nbsp; — = not marked</div>
    </div>

    <div class="userbox">
      <span id="userEmail" class="sub"></span>
      <button id="logout" class="logout">Logout</button>
    </div>
  </div>

  <div class="controls" style="justify-content:center;margin:14px 0">
    <button id="prev">‹</button>
    <input id="month" type="month">
    <button id="next">›</button>
  </div>

  <div class="stats">
    <div class="stat">
      <b id="rate">0%</b>
      <span>Monthly completion</span>
    </div>

    <div class="stat">
      <b id="done">0</b>
      <span>Completed</span>
    </div>

    <div class="stat">
      <b id="miss">0</b>
      <span>Missed</span>
    </div>

    <div class="stat">
      <b id="streak">0</b>
      <span>Best streak</span>
    </div>
  </div>

  <div class="panel">

    <div class="bar">
      <strong id="monthTitle"></strong>

      <form id="add">
        <input id="task" placeholder="Task / subject" required>
        <input id="time" placeholder="Time (e.g. 7:00 AM)">
        <button class="primary">+ Add task</button>
      </form>
    </div>

    <div id="grid" class="table-wrap"></div>

  </div>

</div>
</div>

<script>

/* =========================================
   SUPABASE
   ========================================= */

/*
  YAHAN APNE PEHLE WALE SUPABASE VALUES RAKHO.
  368-line code me jo SUPABASE_URL aur SUPABASE_KEY tha,
  wahi same values yahan paste karo.
*/

const SUPABASE_URL = "https://acsokyrhfequnuvtmomx.supabase.co";
const SUPABASE_KEY = "sb_publishable_q5tlkRgV8Yv377vmWr8sHw_ZGKfWMPi";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   APP STATE
   ========================================= */

let user = null;
let view = new Date();
view.setDate(1);

let state = {
  tasks: [],
  marks: {}
};

const pad = n => String(n).padStart(2,"0");

const key = (d, taskId) =>
  `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}|${taskId}`;


/* =========================================
   AUTH
   ========================================= */

let signupMode = false;

const loginScreen = document.querySelector("#loginScreen");
const app = document.querySelector("#app");
const emailInput = document.querySelector("#email");
const passwordInput = document.querySelector("#password");
const authBtn = document.querySelector("#authBtn");
const switchBtn = document.querySelector("#switchBtn");
const authText = document.querySelector("#authText");
const authMsg = document.querySelector("#authMsg");

switchBtn.onclick = () => {

  signupMode = !signupMode;

  if(signupMode){

    authBtn.textContent = "Create account";
    switchBtn.textContent = "Already have an account? Login";
    authText.textContent = "Naya account banao.";

  }else{

    authBtn.textContent = "Login";
    switchBtn.textContent = "Account nahi hai? Signup";
    authText.textContent = "Login karke apna tracker open karo.";

  }

  authMsg.textContent = "";
};


authBtn.onclick = async () => {

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  authMsg.textContent = "";

  if(!email || !password){
    authMsg.textContent = "Email aur password dono bharo.";
    return;
  }

  if(password.length < 6){
    authMsg.textContent = "Password kam se kam 6 characters ka hona chahiye.";
    return;
  }

  authBtn.disabled = true;

  try{

    if(signupMode){

      const {data,error} = await db.auth.signUp({
        email,
        password
      });

      if(error) throw error;

      if(data.session){

        user = data.user;
        openApp();

      }else{

        authMsg.style.color = "#22a060";
        authMsg.textContent =
          "Account ban gaya! Email verification check karo, phir login karo.";

      }

    }else{

      const {data,error} = await db.auth.signInWithPassword({
        email,
        password
      });

      if(error) throw error;

      user = data.user;
      openApp();

    }

  }catch(error){

    authMsg.style.color = "#e05252";
    authMsg.textContent = error.message || "Login failed.";

  }finally{

    authBtn.disabled = false;

  }
};


document.querySelector("#logout").onclick = async () => {

  await db.auth.signOut();

  user = null;
  state = {tasks:[],marks:{}};

  app.style.display = "none";
  loginScreen.style.display = "flex";

  emailInput.value = "";
  passwordInput.value = "";
  authMsg.textContent = "";

};


/* =========================================
   LOCAL DATA
   ========================================= */

function storageKey(){

  return `my_timetable_tracker_${user.id}`;

}


function loadLocal(){

  try{

    const saved = localStorage.getItem(storageKey());

    state = saved
      ? JSON.parse(saved)
      : {tasks:[],marks:{}};

  }catch{

    state = {tasks:[],marks:{}};

  }

}


function saveLocal(){

  localStorage.setItem(
    storageKey(),
    JSON.stringify(state)
  );

}


/* =========================================
   OPEN APP
   ========================================= */

function openApp(){

  loginScreen.style.display = "none";
  app.style.display = "block";

  document.querySelector("#userEmail").textContent =
    user.email || "";

  loadLocal();
  render();

}


/* =========================================
   RENDER
   ========================================= */

function render(){

  const y = view.getFullYear();
  const m = view.getMonth();

  const days =
    new Date(y,m+1,0).getDate();

  document.querySelector("#month").value =
    `${y}-${pad(m+1)}`;

  document.querySelector("#monthTitle").textContent =
    view.toLocaleDateString("en-IN",{
      month:"long",
      year:"numeric"
    });

  let h =
    `<table>
      <thead>
        <tr>
          <th>Task</th>`;

  for(let d=1;d<=days;d++){

    h += `<th class="day">${d}</th>`;

  }

  h += `
        </tr>
      </thead>
      <tbody>`;

  if(!state.tasks.length){

    h += `
      <tr>
        <td colspan="${days+1}" class="empty">
          Abhi koi task nahi hai. Upar se task add karo 👆
        </td>
      </tr>`;

  }


  state.tasks.forEach((t,ti)=>{

    h += `
      <tr>
        <td>
          <div class="task-name">${esc(t.name)}</div>
          <div class="task-time">${esc(t.time || "")}</div>
          <button class="del" data-del="${ti}">Delete</button>
        </td>`;

    for(let d=1;d<=days;d++){

      const date =
        new Date(y,m,d);

      const k =
        key(date,ti);

      const v =
        state.marks[k] || 0;

      const cls =
        v===1 ? "yes" :
        v===2 ? "no" :
        "none";

      const txt =
        v===1 ? "✓" :
        v===2 ? "X" :
        "—";

      const today =
        new Date().toDateString() ===
        date.toDateString()
          ? " today"
          : "";

      h += `
        <td>
          <button
            class="cell ${cls}${today}"
            data-k="${k}"
            aria-label="${esc(txt)}"
          >${txt}</button>
        </td>`;

    }

    h += `</tr>`;

  });


  h += `
      </tbody>
    </table>`;

  document.querySelector("#grid").innerHTML = h;


  /* MARK BUTTONS */

  document
    .querySelectorAll("[data-k]")
    .forEach(b=>{

      b.onclick = ()=>{

        const k = b.dataset.k;

        let v =
          state.marks[k] || 0;

        /*
          0 = not marked
          1 = complete
          2 = missed
        */

        if(v===0) v=1;
        else if(v===1) v=2;
        else v=0;

        state.marks[k]=v;

        saveLocal();
        render();

      };

    });


  /* DELETE BUTTONS */

  document
    .querySelectorAll("[data-del]")
    .forEach(b=>{

      b.onclick = ()=>{

        const i =
          Number(b.dataset.del);

        if(confirm("Task delete karna hai?")){

          state.tasks.splice(i,1);

          /*
            Purane marks ko clean kar do
          */
          const newMarks = {};

          Object.keys(state.marks).forEach(k=>{

            const parts = k.split("|");
            const taskIndex = Number(parts[1]);

            if(taskIndex < i){

              newMarks[k] = state.marks[k];

            }else if(taskIndex > i){

              newMarks[
                `${parts[0]}|${taskIndex-1}`
              ] = state.marks[k];

            }

          });

          state.marks = newMarks;

          saveLocal();
          render();

        }

      };

    });


  stats(y,m,days);

}


/* =========================================
   STATS
   ========================================= */

function stats(y,m,days){

  let yes = 0;
  let no = 0;

  const all = [];

  state.tasks.forEach((t,ti)=>{

    for(let d=1;d<=days;d++){

      const v =
        state.marks[
          key(new Date(y,m,d),ti)
        ] || 0;

      if(v===1) yes++;
      if(v===2) no++;

      all.push(v);

    }

  });


  const total =
    yes + no;

  document.querySelector("#rate").textContent =
    total
      ? Math.round(yes/total*100)+"%"
      : "0%";

  document.querySelector("#done").textContent =
    yes;

  document.querySelector("#miss").textContent =
    no;


  let best = 0;
  let cur = 0;

  all.forEach(v=>{

    if(v===1){

      cur++;
      best = Math.max(best,cur);

    }else{

      cur = 0;

    }

  });

  document.querySelector("#streak").textContent =
    best;

}


/* =========================================
   ADD TASK
   ========================================= */

document.querySelector("#add").onsubmit = e => {

  e.preventDefault();

  const name =
    document.querySelector("#task").value.trim();

  const time =
    document.querySelector("#time").value.trim();

  if(!name) return;

  state.tasks.push({
    name,
    time
  });

  saveLocal();

  e.target.reset();

  render();

};


/* =========================================
   MONTH NAVIGATION
   ========================================= */

document.querySelector("#prev").onclick = () => {

  view.setMonth(view.getMonth()-1);
  render();

};


document.querySelector("#next").onclick = () => {

  view.setMonth(view.getMonth()+1);
  render();

};


document.querySelector("#month").onchange = () => {

  const [y,m] =
    document.querySelector("#month")
      .value
      .split("-")
      .map(Number);

  view = new Date(y,m-1,1);

  render();

};


/* =========================================
   ESCAPE HTML
   ========================================= */

function esc(s){

  return String(s)
    .replace(/[&<>"']/g,c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c]));

}


/* =========================================
   CHECK EXISTING SESSION
   ========================================= */

(async()=>{

  const {data} =
    await db.auth.getSession();

  if(data.session){

    user = data.session.user;
    openApp();

  }

})();

</script>

</body>
</html>
