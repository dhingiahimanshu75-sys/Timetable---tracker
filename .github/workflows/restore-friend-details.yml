name: Restore friend details
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-friend-details.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore full friend cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<!-- FRIEND_DETAILS_RESTORE -->'
          patch=r'''<!-- FRIEND_DETAILS_RESTORE --><script>
          (()=>{
            const b=document.getElementById('friendsBtn');
            const send=document.getElementById('sendFriendRequest');
            if(b){const n=b.cloneNode(true);b.replaceWith(n);n.onclick=async()=>{document.getElementById('friendsPanel')?.classList.remove('hidden');try{await loadFriendRequests();await loadFriends();}catch(e){console.error(e)}}}
            if(send){const n=send.cloneNode(true);send.replaceWith(n);n.onclick=async()=>{try{await sendFriendRequest();}catch(e){console.error(e)}}}
          })();
          </script>'''
          if marker not in s:
              s=s.replace('</body>',patch+'\n</body>',1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore full friend progress details'
          git push
